[project]
name = "voipms-mcp"
version = "0.1.0"
description = "VOIP.ms Integration MCP for the MSPbots Agent Platform (PRD-18607)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.4.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
]

[project.scripts]
voipms-mcp = "voipms_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voipms_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
